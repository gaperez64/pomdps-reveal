# This workflow will install Python dependencies and run tests

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      LD_LIBRARY_PATH: /usr/local/lib
      PYTHONPATH: /usr/local/lib/python3.12/site-packages

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install graphviz
      run: |
        sudo apt-get install graphviz graphviz-dev
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Check PEP 8
      run: python -m flake8 belief_support_algorithm.py pomdpy scripts
    - name: Install spot
      run: |
        wget "https://www.lrde.epita.fr/dload/spot/spot-2.14.1.tar.gz"
        tar -xvzf "spot-2.14.1.tar.gz"
        cd spot-2.14.1
        ./configure
        make -j"$(nproc)"
        sudo make install
        cd ..
    - name: Generate LTL models for tests
      run: python scripts/transform_to_revealing.py
    - name: Test with pytest
      run: python -m pytest
