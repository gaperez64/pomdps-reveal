# This workflow will install Python dependencies and run tests

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install system dependencies
      run: |
        wget -q -O - 'https://build.opensuse.org/projects/home:adl/signing_keys/download?kind=gpg' \
          | gpg --dearmor \
          | sudo tee /etc/apt/keyrings/home-adl-obs.gpg > /dev/null
        echo 'deb [signed-by=/etc/apt/keyrings/home-adl-obs.gpg] https://download.opensuse.org/repositories/home:/adl/xUbuntu_24.04/ ./' \
          | sudo tee /etc/apt/sources.list.d/home-adl-obs.list
        sudo apt-get update
        sudo apt-get install -y graphviz graphviz-dev python3-spot=2.16.1.0-1
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Install tlsf-tools
      run: |
        curl -fL \
          https://github.com/gaperez64/tlsf-tools/releases/download/v1.8/tlsf-tools-v1.8-linux-x86_64-v2.tar.gz \
          -o "$RUNNER_TEMP/tlsf.tar.gz"
        printf '%s  %s\n' \
          a178c77dba23ba6163f0ebf85dc2fdcb098d28475a124be9039efe7f5af254bf \
          "$RUNNER_TEMP/tlsf.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/tlsf.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/tlsf-tools-v1.8-linux-x86_64-v2" >> "$GITHUB_PATH"
    - name: Check PEP 8
      run: python -m flake8 belief_support_algorithm.py pomdpy scripts
    - name: Generate LTL models for tests
      env:
        PYTHONPATH: /usr/lib/python3/dist-packages
      run: python scripts/transform_to_revealing.py
    - name: Test with pytest
      env:
        PYTHONPATH: /usr/lib/python3/dist-packages
      run: python -m pytest
