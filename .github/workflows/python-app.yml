# This workflow will install Python dependencies and run tests

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: /usr/lib/python3/dist-packages

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install system dependencies
      run: |
        wget -q -O - 'https://build.opensuse.org/projects/home:adl/signing_keys/download?kind=gpg' \
          | gpg --dearmor \
          | sudo tee /etc/apt/keyrings/home-adl-obs.gpg > /dev/null
        echo 'deb [signed-by=/etc/apt/keyrings/home-adl-obs.gpg] https://download.opensuse.org/repositories/home:/adl/xUbuntu_24.04/ ./' \
          | sudo tee /etc/apt/sources.list.d/home-adl-obs.list
        sudo apt-get update
        sudo apt-get install -y graphviz graphviz-dev python3-spot=2.16.1.0-1
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Check PEP 8
      run: python -m flake8 belief_support_algorithm.py pomdpy scripts
    - name: Generate LTL models for tests
      run: python scripts/transform_to_revealing.py
    - name: Test with pytest
      run: python -m pytest
